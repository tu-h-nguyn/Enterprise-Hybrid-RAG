name: Benchmark (neural backends)

# The development sandbox could not reach the model hub, so the committed
# numbers were produced on the offline fallbacks. A GitHub runner can reach it,
# so this workflow is where the real all-MiniLM-L6-v2 / cross-encoder numbers
# come from. It regenerates results.json and report.md and commits them back.
#
# No Hugging Face token is required: both models are public.
#
# Two jobs run here: the headline benchmark, and the corpus-scale experiment
# that grows the haystack from 44 to roughly 5000 chunks. They are serialised
# because both may commit regenerated artefacts to the same branch.

on:
  # Manual is the intended way to run this: it is slow and costs a cross-encoder
  # pass over every question. pull_request is kept so the numbers a PR publishes
  # are regenerated by the PR that publishes them, rather than trusted from a
  # developer's machine.
  workflow_dispatch:
  pull_request:
    branches: ["main"]

permissions:
  contents: write

concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: enterprise-hybrid-rag

jobs:
  benchmark:
    name: Full benchmark on neural backends
    runs-on: ubuntu-latest
    timeout-minutes: 90

    # Explicit rather than `auto`: if the hub were unreachable, `auto` would
    # quietly fall back and this job would commit fallback numbers under a name
    # that says neural. Pinned, it fails loudly instead.
    env:
      EMBEDDING_BACKEND: sentence_transformers
      RERANKER_BACKEND: cross_encoder
      LLM_PROVIDER: extractive

    steps:
      # For a pull_request event, the default checkout is the merge ref in
      # detached HEAD, and the commit-back step at the end then has no branch to
      # push to. Check out the head branch itself.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: enterprise-hybrid-rag/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ingest with the neural embedder
        run: python scripts/ingest.py --quiet

      - name: Confirm the neural backends were actually selected
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m = json.loads(Path("data/processed/index_manifest.json").read_text())
          print(json.dumps(m["embedder"], indent=2))
          assert m["embedder"]["backend"] == "sentence_transformers", m["embedder"]
          assert m["embedder"]["dimension"] == 384, m["embedder"]
          print("neural embedder confirmed")
          PY

      # Keep the committed numbers so the fresh run can be compared against them.
      - name: Snapshot the committed results
        run: |
          mkdir -p /tmp/baseline
          cp data/evaluation/results.json /tmp/baseline/results.json 2>/dev/null \
            || echo "no committed results yet"

      - name: Run the full benchmark
        run: python scripts/benchmark.py --quiet

      # Quality metrics are deterministic given the same corpus, dataset and
      # backends; latency is not. Comparing only the former turns this into a
      # reproducibility check, and stops the job committing a new file on every
      # run purely because wall-clock timings moved.
      - name: Compare against the committed numbers
        id: compare
        run: |
          if python scripts/compare_results.py \
               --baseline /tmp/baseline/results.json \
               --candidate data/evaluation/results.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Print the report
        run: cat data/evaluation/report.md

      - name: Print a compact metric summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d = json.loads(Path("data/evaluation/results.json").read_text())
          print("BACKENDS", json.dumps(d["backends"]))
          print("INDEX", json.dumps(d["index"]))
          for r in d["retrieval"]:
              print("RETRIEVAL", json.dumps({
                  "label": r["label"], "metrics": r["metrics"],
                  "latency_ms_mean": r["latency_ms_mean"],
                  "latency_ms_p95": r["latency_ms_p95"],
                  "by_question_type": r["by_question_type"]}))
          for row in d.get("chunk_size_ablation", []):
              print("ABLATION", json.dumps({
                  k: row[k] for k in
                  ("chunk_size_tokens", "chunk_overlap_tokens", "n_chunks",
                   "mean_chunk_tokens", "embedding_dim")} |
                  {"configs": [{"label": c["label"], "metrics": c["metrics"]}
                               for c in row["configs"]]}))
          print("GENERATION", json.dumps(d["generation"]["metrics"]))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-neural
          path: |
            enterprise-hybrid-rag/data/evaluation/results.json
            enterprise-hybrid-rag/data/evaluation/report.md

      # Only when a quality metric actually moved. [skip ci] on the commit stops
      # this workflow retriggering itself.
      - name: Commit the regenerated results
        if: steps.compare.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/evaluation/results.json data/evaluation/report.md
          if git diff --cached --quiet; then
            echo "nothing staged"
          else
            git commit -m "Regenerate benchmark results on the neural backends [skip ci]"
            git push
          fi

      - name: Report reproducibility
        if: steps.compare.outputs.changed == 'false'
        run: echo "Quality metrics reproduced the committed numbers exactly; nothing to commit."

  scale:
    name: Corpus-scale experiment on neural backends
    runs-on: ubuntu-latest
    # Serialised behind the benchmark job: both commit to the same branch, and
    # two concurrent pushes would race.
    needs: benchmark
    timeout-minutes: 120

    env:
      EMBEDDING_BACKEND: sentence_transformers
      RERANKER_BACKEND: cross_encoder
      LLM_PROVIDER: extractive

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: enterprise-hybrid-rag/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # The experiment builds every index in a temporary directory, so there is
      # nothing to ingest first. This downloads both models once, up front,
      # instead of during the first timed run. It deliberately exits 0 even when
      # the hub is unreachable; the assertion after the run is what actually
      # refuses to publish fallback numbers under a neural heading.
      - name: Warm the models
        run: python scripts/warm_models.py

      - name: Snapshot the committed scale results
        run: |
          mkdir -p /tmp/baseline
          cp data/evaluation/scale_results.json /tmp/baseline/scale_results.json 2>/dev/null \
            || echo "no committed scale results yet"

      - name: Run the scale experiment
        run: python scripts/scale_experiment.py --quiet

      # The embedder must be the neural one *and* must hold its width at 384
      # across every corpus size. The tfidf_svd fallback derives its dimension
      # from the corpus, which would vary the encoder along with the haystack
      # and make the curve unreadable.
      - name: Confirm the neural embedder held at 384 dimensions everywhere
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d = json.loads(Path("data/evaluation/scale_results.json").read_text())
          print(json.dumps(d["backends"], indent=2))
          assert d["backends"]["embedder"]["backend"] == "sentence_transformers", d["backends"]
          assert d["backends"]["is_neural_reranker"], d["backends"]
          dims = sorted({row["embedding_dim"] for row in d["sizes"]})
          print("embedding dims across sizes:", dims)
          assert dims == [384], dims
          print("neural backends confirmed at every corpus size")
          PY

      # Chroma's HNSW index is approximate and two identical runs disagree on a
      # handful of deep-rank values, so holding it to bit equality would rewrite
      # the artefact on every run and the check would stop meaning anything.
      # Exhaustive search is still held to bit equality, and the drift is printed.
      - name: Compare against the committed scale numbers
        id: compare
        run: |
          if python scripts/compare_results.py \
               --baseline /tmp/baseline/scale_results.json \
               --candidate data/evaluation/scale_results.json \
               --allow-drift 'scale.chroma/'; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Print the report
        run: cat data/evaluation/scale_report.md

      - uses: actions/upload-artifact@v4
        with:
          name: scale-neural
          path: |
            enterprise-hybrid-rag/data/evaluation/scale_results.json
            enterprise-hybrid-rag/data/evaluation/scale_report.md

      - name: Commit the regenerated scale results
        if: steps.compare.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/evaluation/scale_results.json data/evaluation/scale_report.md
          if git diff --cached --quiet; then
            echo "nothing staged"
          else
            git commit -m "Regenerate the corpus-scale experiment on the neural backends [skip ci]"
            # The benchmark job may have pushed to this branch moments ago.
            git pull --rebase origin "${{ github.head_ref || github.ref_name }}"
            git push
          fi

      - name: Report reproducibility
        if: steps.compare.outputs.changed == 'false'
        run: echo "Scale metrics reproduced the committed numbers exactly; nothing to commit."
