name: CI

# The project lives in a subdirectory, but workflow files are only read from
# the repository root, so every step runs with working-directory set below.

# Pushes to a branch with an open PR are covered by the pull_request event, so
# push is limited to main to avoid running the same commit twice.
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

# A newer push supersedes an in-flight run on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: enterprise-hybrid-rag

jobs:
  test:
    name: Tests and dataset audit
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Pin the offline backends rather than leaving `auto`. A GitHub runner can
    # reach the model hub, so `auto` would select all-MiniLM-L6-v2 and the
    # cross-encoder — and then the assertions below would depend on neural model
    # output, which is not a stable thing to gate a merge on (the abstention
    # check in particular compares against a cross-encoder logit threshold).
    # Pinned, this job is deterministic, needs no model download, and fails only
    # when the pipeline itself regresses. The neural path is exercised by
    # running the benchmark on a hub-connected machine, not here.
    env:
      EMBEDDING_BACKEND: tfidf_svd
      RERANKER_BACKEND: lexical
      LLM_PROVIDER: extractive

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: enterprise-hybrid-rag/requirements.txt

      # requirements-dev.txt includes requirements.txt, so this still validates
      # the documented install path rather than a trimmed variant.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      # The project claims type hints everywhere; this is what makes that
      # claim checkable rather than a README assertion.
      - name: Type check
        run: mypy

      # Hermetic: fixtures build their own index in tmp_path, so this needs no
      # network, no API key and no pre-existing index. The coverage floor sits
      # just under the current figure, so it catches a regression without
      # becoming a target to game.
      - name: Run tests with coverage
        run: pytest -q --cov=app --cov-report=term-missing --cov-fail-under=70

      - name: Ingest the demo corpus
        run: python scripts/ingest.py --quiet

      # Ground truth is answer spans resolved against the chunks at evaluation
      # time, so a chunker or loader change can silently stop labels resolving.
      # An unresolvable label drives recall to zero and looks exactly like a
      # retrieval failure, which is why this is a blocking gate: the script
      # exits non-zero when any label fails to resolve.
      - name: Audit evaluation dataset labels
        run: python scripts/evaluate.py --audit-only

      - name: Smoke-test the API
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from app.main import create_app

          with TestClient(create_app()) as client:
              health = client.get("/health").json()
              print("health:", health)
              assert health["status"] == "ok", health
              assert health["index_ready"] is True, health

              result = client.post("/query", json={
                  "question": "How many days of paid annual leave are employees entitled to?",
                  "top_k": 5,
              }).json()
              print("answer:", result["answer"][:160])
              assert "22 days" in result["answer"], result["answer"]
              assert result["citations"], "expected at least one citation"
              assert result["citations"][0]["source"] == "employee_handbook.pdf", result["citations"]

              refusal = client.post("/query", json={
                  "question": "What is the vesting schedule for employee stock options?",
              }).json()
              print("refusal:", refusal["answer"][:160])
              assert refusal["metadata"]["no_answer"] is True, refusal["metadata"]
              assert not refusal["citations"], refusal["citations"]

          print("API smoke test passed")
          PY

  docker:
    name: Docker image builds and serves
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5

      # torch and the CUDA wheels make the image large; reclaim space from
      # preinstalled SDKs this build has no use for.
      - name: Free disk space
        run: |
          echo "before:"; df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
                      /opt/hostedtoolcache/CodeQL /usr/local/.ghcup || true
          echo "after:"; df -h / | tail -1

      - name: Build the api image
        run: docker build --target api -t enterprise-hybrid-rag:api .

      # Shares every layer with api up to the final stage, so this only proves
      # the ui target resolves; it costs seconds.
      - name: Build the ui image
        run: docker build --target ui -t enterprise-hybrid-rag:ui .

      # The image deliberately does not bake the corpus in, so data/ is a bind
      # mount. The container runs as uid 10001, and a bind mount keeps the host
      # ownership, so hand the directory over or the index write fails.
      - name: Hand the data directory to the container user
        run: sudo chown -R 10001:10001 data

      - name: Ingest inside the container
        run: |
          docker run --rm -v "$PWD/data:/app/data" \
            enterprise-hybrid-rag:api python scripts/ingest.py --quiet

      # Backends are left on `auto` here on purpose: a runner can reach the
      # model hub, so this is the one place the neural path actually gets
      # exercised. The assertions stay loose for that reason — the selected
      # backend is printed as evidence rather than asserted on.
      - name: Serve the API from the container and query it
        run: |
          docker run -d --name rag-api -p 8000:8000 \
            -v "$PWD/data:/app/data" enterprise-hybrid-rag:api

          for i in $(seq 1 60); do
            if curl -sf http://localhost:8000/health > /dev/null; then
              echo "API answered after ${i}s"; break
            fi
            if [ "$i" = "60" ]; then
              echo "API never became healthy; container logs follow:"
              docker logs rag-api
              docker rm -f rag-api
              exit 1
            fi
            sleep 1
          done

          echo "--- /health ---"
          curl -s http://localhost:8000/health | tee /tmp/health.json
          echo
          python3 -c "
          import json, sys
          h = json.load(open('/tmp/health.json'))
          print('selected embedding backend:', h['embedding_backend'])
          print('selected reranker        :', h['reranker'])
          print('selected llm             :', h['llm_provider'])
          assert h['status'] == 'ok', h
          assert h['index_ready'] is True, h
          assert h['n_chunks'] > 0, h
          "

          echo "--- /query ---"
          curl -s -X POST http://localhost:8000/query \
            -H 'Content-Type: application/json' \
            -d '{"question":"How many days of paid annual leave are employees entitled to?","top_k":5,"include_chunks":false}' \
            | tee /tmp/query.json
          echo
          python3 -c "
          import json
          r = json.load(open('/tmp/query.json'))
          print('answer:', r['answer'][:200])
          print('citations:', [(c['source'], c.get('page')) for c in r['citations']])
          assert r['answer'].strip(), 'empty answer'
          assert r['metadata']['latency_ms'] > 0, r['metadata']
          "

          docker rm -f rag-api

      - name: Report image sizes
        run: docker images enterprise-hybrid-rag --format '{{.Repository}}:{{.Tag}}  {{.Size}}'
